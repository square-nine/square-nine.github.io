{% if site.likes_api %}
<div class='like-wrap my-4' data-slug='{{ page.url }}' data-api='{{ site.likes_api }}'>
  <button type='button' id='like-btn' class='like-btn' aria-pressed='false' aria-label='Like this post'>
    <i class='far fa-heart' aria-hidden='true'></i>
    <span id='like-count'>0</span>
  </button>
</div>

<style>
  .like-btn {
  display: inline-flex;
  align-items: center;
  gap: .6rem;
  padding: .25rem .5rem;
  border: none;
  background: transparent;
  color: #CF074E;
  cursor: pointer;
  font-size: 1.25rem;
  }
  .like-btn:hover:not(:disabled) { opacity: .75; }
  .like-btn:disabled { opacity: 1; cursor: default; color: #CF074E; }
  .like-btn:focus-visible { outline: 2px solid #CF074E; outline-offset: 2px; }
</style>

<script>
  (() => {
    const wrap = document.querySelector('.like-wrap');
    if (!wrap) return;
    const slug = wrap.dataset.slug;
    const url = wrap.dataset.api + '?slug=' + encodeURIComponent(slug);
    const btn = document.getElementById('like-btn');
    const count = document.getElementById('like-count');
    const icon = btn.querySelector('i');
    const storeKey = 'liked:' + slug;

    const show = (n) => { if (Number.isFinite(n)) count.textContent = n; };
    const setLiked = () => {
      icon.className = 'fas fa-heart';
      btn.classList.add('liked');
      btn.setAttribute('aria-pressed', 'true');
      btn.disabled = true;
    };

    try { if (localStorage.getItem(storeKey)) setLiked(); } catch (e) {}

    fetch(url).then((r) => r.json()).then((d) => show(d.likes)).catch(() => {});

    btn.addEventListener('click', () => {
      setLiked();
      show(Number(count.textContent) + 1);
      try { localStorage.setItem(storeKey, '1'); } catch (e) {}
      /* Record the like as a GoatCounter event, if the script has loaded */
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({ path: 'like' + slug, title: 'Like', event: true });
      }
      fetch(url, { method: 'POST' }).then((r) => r.json()).then((d) => show(d.likes)).catch(() => {});
    });
  })();
</script>
<script>
  (() => {
    const slug = document.querySelector('.like-wrap')?.dataset.slug || location.pathname;
    const marks = [50, 90];
    const sent = {};
    addEventListener('scroll', () => {
      const el = document.documentElement;
      const pct = ((el.scrollTop + innerHeight) / el.scrollHeight) * 100;
      marks.forEach((m) => {
        if (pct >= m && !sent[m]) {
          sent[m] = true;
          window.goatcounter?.count?.({ path: 'scroll-' + m + slug, title: 'Scrolled ' + m + '%', event: true });
        }
      });
    }, { passive: true });
  })();
</script>
{% endif %}
